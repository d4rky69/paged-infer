[project]
name = "paged-infer"
version = "0.1.0"
description = "High-Throughput LLM Serving Engine with Paged KV Cache Management and Continuous Batching"
authors = [
    { name = "PagedInfer Contributors" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
torch = [
    "torch>=2.0.0",
]

[project.scripts]
paged-infer = "paged_infer.api.server:main"
benchmark-serving = "benchmarks.benchmark_serving:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paged_infer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
